version: '3.8'

services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
    image: clood/open-webui:v0.6.10
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
      - ~/Code:/app/code:ro
      - ${DROP_ZONE:-./drop-zone}:/app/drop-zone:ro
    environment:
      # === CLOOD PROXY INTEGRATION ===
      # Use clood proxy for multi-host routing (routes to mac-mini, ubuntu25, localhost)
      # Start proxy first: clood proxy --port 4000
      - OPENAI_API_BASE_URL=http://host.docker.internal:4000/v1
      - OPENAI_API_KEY=sk-clood-local
      # Fallback to direct Ollama if proxy not running
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Disable telemetry
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      # SearXNG web search integration
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - webui-net
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8889:8080"
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8889/
    networks:
      - webui-net

networks:
  webui-net:
    external: true

volumes:
  open-webui-data:
